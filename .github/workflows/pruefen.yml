name: prüfen

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test -race ./...
