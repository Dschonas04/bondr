name: release

on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: bauen
        shell: cmd
        run: bauen.cmd
      - name: Prüfsumme
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\Bondr.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Bondr.exe" | Out-File -Encoding ascii dist\pruefsumme.txt
      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/Bondr.exe
            dist/pruefsumme.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
