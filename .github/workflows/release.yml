name: release

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin GOARCH=arm64 go vet ./...
      - run: go test -race ./...
      - run: python3 -m py_compile linux/bondr.py

  windows:
    needs: pruefen
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Fassung
        shell: bash
        env:
          REF: ${{ github.ref_name }}
        run: |
          f="${REF#v}"
          case "$f" in [0-9]*.[0-9]*.[0-9]*) : ;; *) f="0.0.0" ;; esac
          echo "FASSUNG=$f" >> "$GITHUB_ENV"
      - name: Kern bauen
        shell: bash
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui -X main.Version=$FASSUNG" -o windows/dist/bondrd.exe ./cmd/bondrd
      - name: WinDivert holen
        shell: bash
        run: |
          curl -fsSLo wd.zip https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip
          echo "63cb41763bb4b20f600b6de04e991a9c2be73279e317d4d82f237b150c5f3f15  wd.zip" | sha256sum -c -
          unzip -q wd.zip
          cp WinDivert-2.2.2-A/x64/WinDivert.dll WinDivert-2.2.2-A/x64/WinDivert64.sys windows/dist/
          cp WinDivert-2.2.2-A/LICENSE windows/dist/WinDivert-LIZENZ.txt
      - name: App bauen
        shell: cmd
        working-directory: windows
        run: bauen.cmd
      - name: Installer bauen
        shell: pwsh
        working-directory: windows
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress | Out-Null; $env:PATH += ";C:\Program Files (x86)\NSIS" }
          makensis -V2 "-DFASSUNG=$env:FASSUNG" installer.nsi
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: windows/dist/Bondr-*-Setup.exe

  mac:
    needs: pruefen
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: bauen
        env:
          REF: ${{ github.ref_name }}
        run: |
          f="${REF#v}"
          case "$f" in [0-9]*.[0-9]*.[0-9]*) : ;; *) f="0.0.0" ;; esac
          mkdir -p mac/kern
          for a in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$a go build -trimpath -ldflags "-s -w -X main.Version=$f" -o mac/kern/bondrd-$a ./cmd/bondrd
          done
          ./mac/bauen.sh "$f"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: mac/bau/Bondr-*-mac.dmg

  linux:
    needs: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: bauen
        env:
          REF: ${{ github.ref_name }}
        run: |
          f="${REF#v}"
          case "$f" in [0-9]*.[0-9]*.[0-9]*) : ;; *) f="0.0.0" ;; esac
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.0
          mkdir -p bau aus
          for a in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -trimpath -ldflags "-s -w -X main.Version=$f" -o bau/bondrd-$a ./cmd/bondrd
            (cd linux && for p in deb rpm; do FASSUNG=$f ARCH=$a nfpm pkg -f nfpm.yaml -p $p -t ../aus/; done)
            d=bau/Bondr-$f-linux-$a
            mkdir -p $d
            cp bau/bondrd-$a $d/bondrd
            cp linux/bondr.py linux/installieren.sh linux/io.github.dschonas04.bondr.desktop LICENSE $d/
            cp docs/logo.svg $d/io.github.dschonas04.bondr.svg
            tar -C bau -czf aus/Bondr-$f-linux-$a.tar.gz Bondr-$f-linux-$a
          done
          ls -la aus
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: aus/*

  veroeffentlichen:
    needs: [windows, mac, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: alle
      - run: cd alle && sha256sum */* > ../pruefsummen.txt && cat ../pruefsummen.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            alle/**/*
            pruefsummen.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
